name: Merge Skill Branch to Main (skill/ascend-model-adapter -> main)

on:
  push:
    branches:
      - skill/ascend-model-adapter

  workflow_dispatch:

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if merge is needed
        id: check_needed
        run: |
          SKILL_PATH=".agents/skills/ascend-model-adapter"
          SPLIT_BRANCH="skill/ascend-model-adapter"
          MAIN_BRANCH="main"

          git fetch origin
          git checkout $MAIN_BRANCH
          git pull origin $MAIN_BRANCH

          MAIN_TREE=$(git rev-parse origin/$MAIN_BRANCH:$SKILL_PATH)
          SPLIT_TREE=$(git rev-parse origin/$SPLIT_BRANCH^{tree})

          echo "Main skill tree: $MAIN_TREE"
          echo "Split branch tree: $SPLIT_TREE"

          if [ "$MAIN_TREE" = "$SPLIT_TREE" ]; then
            echo "Content already in sync, skipping merge"
            echo "needs_merge=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected, will merge"
            echo "needs_merge=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge skill branch into main via subtree
        if: steps.check_needed.outputs.needs_merge == 'true'
        run: |
          SKILL_PATH=".agents/skills/ascend-model-adapter"
          SPLIT_BRANCH="skill/ascend-model-adapter"
          MAIN_BRANCH="main"

          echo "==> Checking out $MAIN_BRANCH..."
          git checkout $MAIN_BRANCH
          git pull origin $MAIN_BRANCH

          echo "==> Merging $SPLIT_BRANCH into $SKILL_PATH via subtree..."
          git subtree merge --prefix=$SKILL_PATH origin/$SPLIT_BRANCH --squash -m "[skip-split-sync] Merge skill updates from $SPLIT_BRANCH into main"

          echo "==> Pushing to origin/$MAIN_BRANCH..."
          git push origin $MAIN_BRANCH

          echo "==> Done! Changes from $SPLIT_BRANCH merged into main."
